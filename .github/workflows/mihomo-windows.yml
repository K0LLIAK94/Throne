name: Mihomo Windows preview

on:
  workflow_dispatch:
  push:
    branches: [feature/mihomo-profiles]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
      INPUT_VERSION: 1.0.0-mihomo-preview
      GO_TAGS: with_clash_api,with_quic,with_wireguard,with_utls,with_dhcp,with_tailscale,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_purego,with_naive_outbound
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: '31.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate RPC bindings
        working-directory: core
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          protoc -I gen --go_out=gen --go-grpc_out=gen gen/libcore.proto
      - name: Test core routing and adapters
        working-directory: core
        run: go test -ldflags=-checklinkname=0 -tags "$env:GO_TAGS" ./internal/...
      - name: Build core
        working-directory: core
        run: |
          New-Item -ItemType Directory -Force ../deployment/windows-amd64 | Out-Null
          go build -trimpath -ldflags '-w -s -checklinkname=0' -tags "$env:GO_TAGS" -o ../deployment/windows-amd64/ThroneCore.exe .
          $cronet = go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/windows_amd64
          Copy-Item "$cronet/libcronet.dll" ../deployment/windows-amd64/
      - uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundle dashboard
        run: |
          New-Item -ItemType Directory -Force res/dashboard | Out-Null
          Get-ChildItem dashboard-src -Force | Where-Object Name -ne '.git' | Copy-Item -Destination res/dashboard -Recurse
          if (!(Test-Path res/dashboard/index.html)) { throw 'Dashboard was not bundled' }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: Mihomo-WinQt-6.11.2-x64
      - name: Prepare Qt and configure GUI
        run: |
          if (!(Test-Path qt.7z)) { curl.exe -fL -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_6.11.2/Qt_6.11.2_x64.7z }
          if (!(Test-Path openssl.7z)) { curl.exe -fL -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_x64.7z }
          7z x -y qt.7z
          7z x -y openssl.7z
          New-Item -ItemType Directory -Force build | Out-Null
          curl.exe -fL -o build/srslist.h https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$pwd/Qt/lib/cmake" -DOPENSSL_ROOT_DIR="$pwd/openssl" -DINPUT_VERSION="$env:INPUT_VERSION" -DTHRONE_BUILD_TESTS=ON -DSPB_PROTO_USE_CLANG_FORMAT=OFF
      - name: Build and test GUI
        run: |
          cmake --build build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build --output-on-failure
      - name: Package preview
        run: |
          Copy-Item build/Throne.exe deployment/windows-amd64/
          curl.exe -fL -o deployment/windows-amd64/updater.exe https://github.com/throneproj/updater/releases/latest/download/updater-windows-x64.exe
          Copy-Item docs/mihomo.md deployment/windows-amd64/
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: Throne-mihomo-windows-amd64
          path: deployment/windows-amd64/
          if-no-files-found: error
